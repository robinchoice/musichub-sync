name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p musichub-sync-core

  app:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles msi
            out: target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            out: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: app
      # Signed with the Developer ID certificate, notarized with the App Store Connect key, so testers
      # open the app without Gatekeeper warnings. The certificate goes into a keychain of its own.
      # Pull requests from forks get no secrets and build unsigned.
      - name: macOS signing
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc.p8"
            echo "APPLE_API_KEY=${{ vars.ASC_KEY_ID }}"
            echo "APPLE_API_ISSUER=${{ vars.ASC_ISSUER_ID }}"
          } >> "$GITHUB_ENV"
      - run: bunx tauri build ${{ matrix.args }}
        working-directory: app
      - name: Check signature and notarization
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          app="$RUNNER_TEMP/dmg/Music Hub Sync.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: musichub-sync-${{ runner.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The annotated tag carries the release notes; checkout may leave only a lightweight tag
      - run: git fetch --depth=1 --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "Music Hub Sync $GITHUB_REF_NAME" --prerelease "${notes[@]}"
